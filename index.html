        video {

        /* Estilos para el botón de instalación */

        #installButton:hover {

        /* Estilos para los iconos de redes sociales */
        .social-icons {
            position: absolute;
            right: 20px; 
            top: 50%;

            flex-direction: column; 
            gap: 10px; 
        }

        .social-icon {
            width: 40px; 
            height: 40px; 
            border-radius: 50%; 
            object-fit: cover; 
        }

        /* Estilo para el modal del chat */
        .chat-modal {
            display: none; 
            position: fixed;
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            background-color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            transition: transform 0.5s ease;
            transform: translateY(100%); 
            z-index: 999;
        }

        .chat-modal.show {
            display: block;
            transform: translateY(0); 
        }

        .chat-modal iframe {
            width: 100%; 
            height: 100%; 
            border: none;
        }

        .close {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 30px;
            cursor: pointer;
            z-index: 1000; 
        }

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <script>
        let deferredPrompt = null;
        const installButton = document.getElementById('installButton');
        const installButtonWrapper = document.getElementById('installButtonWrapper');
        if (installButtonWrapper) installButtonWrapper.style.display = 'none';

        window.addEventListener('beforeinstallprompt', (event) => {
            event.preventDefault();
            deferredPrompt = event;
            if (installButtonWrapper) installButtonWrapper.style.display = 'block';
        });

        if (installButton) installButton.addEventListener('click', async () => {
            if (!deferredPrompt) {
                alert('Para instalar esta aplicación, abre el menú del navegador y selecciona “Instalar aplicación” o “Añadir a pantalla de inicio”.');
                return;
            }
            deferredPrompt.prompt();
            await deferredPrompt.userChoice;
            deferredPrompt = null;
            if (installButtonWrapper) installButtonWrapper.style.display = 'none';
        });

        function toggleNav() {
            const sidebar = document.getElementById('mySidebar');
            if (!sidebar) return;
            sidebar.style.width = sidebar.style.width === '250px' ? '0' : '250px';
        }
        function closeNav() {
            const sidebar = document.getElementById('mySidebar');
            if (sidebar) sidebar.style.width = '0';
        }
        document.addEventListener('click', (event) => {
            const sidebar = document.getElementById('mySidebar');
            const button = document.querySelector('.openbtn');
            if (sidebar && button && sidebar.style.width === '250px' && !sidebar.contains(event.target) && !button.contains(event.target)) closeNav();
        });

        if (window.jQuery && jQuery.fn.lunaradio) {
            jQuery(function ($) {
                $('#lunaradio').lunaradio({
                    userinterface: 'big',
                    backgroundcolor: 'transparent',
                    fontcolor: '#ffffff',
                    hightlightcolor: '#ffffff',
                    fontname: 'Unica One',
                    googlefont: 'Unica+One&display=swap',
                    fontratio: '0.4',
                    radioname: 'Radio Karimar 91.1 FM - Transmite desde Villa Rica',
                    scroll: 'true',
                    coverimage: 'imagenes/logo.png',
                    onlycoverimage: 'true',
                    coverstyle: '',
                    usevisualizer: 'real',
                    visualizertype: '3',
                    multicolorvisualizer: 'true',
                    color1: '#ffffff',
                    visualizeropacity: '6',
                    itunestoken: '1000lIPN',
                    metadatatechnic: 'creativo-agencia-metadato',
                    ownmetadataurl: '',
                    metadata: '',
                    streamurl: 'https://stream.zeno.fm/21rwab86cfeuv',
                    streamtype: 'zeno',
                    idzeno: '21rwab86cfeuv',
                    shoutcastpath: '/electronic.mp3',
                    metadatainterval: '20000',
                    volume: '100',
                    debug: 'false',
                    usestreamcorsproxy: 'false',
                    autoplay: 'true',
                    displayliveicon: 'true',
                    displayvisualizericon: 'true'
                });
            });
        } else {
            console.error('No se pudo cargar js/lunaradio.min.js o jQuery.');
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch((error) => console.error('Error al registrar el Service Worker:', error));
            });
        }
    </script>
